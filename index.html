<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Bucin Romantis</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#ffd6e0;color:white}
header{height:100vh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
#loveVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.hero{position:relative;z-index:2;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:20px}
.card img{width:100%;height:320px;object-fit:cover;border-radius:12px}
h2{text-align:center}
</style>
</head>
<body>
<header>
<video id="loveVideo" autoplay muted loop playsinline>
<source src="https://files.catbox.moe/yn7www.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="hero">
<h1>Kamu Adalah Alasanku Bahagia ❤️</h1>
<p>Terima kasih sudah jadi bagian paling indah dalam hidupku.</p>
</div>
</header>

<h2>Galeri Kita 💖</h2>
<div class="grid">
<img src="https://files.catbox.moe/k3waij.jpg">
<img src="https://files.catbox.moe/ieefhg.jpg">
<img src="https://files.catbox.moe/uzw6tf.jpg">
<img src="https://files.catbox.moe/vbisdn.jpg">
<img src="https://files.catbox.moe/8pyqcq.jpg">
<img src="https://files.catbox.moe/5nlpwi.jpg">
<img src="https://files.catbox.moe/odnkpf.jpg">
<img src="https://files.catbox.moe/xvslb4.jpg">
<img src="https://files.catbox.moe/8c6cmm.jpg">
<img src="https://files.catbox.moe/67vdg9.jpg">
</div>

<script>
const loveVideo=document.getElementById("loveVideo");
loveVideo.addEventListener("click",async()=>{
 loveVideo.muted=false;
 try{
   if(loveVideo.requestFullscreen) await loveVideo.requestFullscreen();
 }catch(e){}
});
</script>
</body>
</html>
